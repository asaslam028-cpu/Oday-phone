name: oday_phone
description: Oday Phone
publish_to: 'none'
version: 1.0.0+11
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  image_picker: ^1.0.8
flutter:
  uses-material-design: true
  assets:
    - IMG-20261031-WA9506.jpg
    - IMG-20261031-WA4508.jpg
dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "IMG-20261031-WA9506.jpg"
  min_sdk_android: 21
  web:
    generate: false
