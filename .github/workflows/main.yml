name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup google-services
        run: cp android/app/google-services.json /tmp/g.json || echo "no file"
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Fix Android
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.oday --project-name oday_store
          sed -i 's/android:label="[^"]*"/android:label="عدي ستور"/' android/app/src/main/AndroidManifest.xml
          cp /tmp/g.json android/app/google-services.json
      - run: flutter pub get
      - run: flutter pub run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: oday-phone-final-fixed
          path: build/app/outputs/flutter-apk/app-release.apk
