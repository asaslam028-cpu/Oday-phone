name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backup google-services.json
        run: cp android/app/google-services.json /tmp/google-services.json || echo "no file"
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Recreate Android with correct package
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.oday --project-name phone
          cp /tmp/google-services.json android/app/google-services.json
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: oday-phone-apk
          path: build/app/outputs/flutter-apk/app-release.apk
