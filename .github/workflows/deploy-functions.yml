name: Deploy Functions
on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g firebase-tools
      - run: cd functions && npm install
      - run: firebase deploy --only functions --project addy-phone-906bf --token "${{ secrets.FIREBASE_TOKEN }}"
